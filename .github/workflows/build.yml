name: Build and Publish Distributions

on:
  push:
    tags:
      - "v*"

jobs:
  full_tests:
    name: Run full pre-release test suite
    uses: ./.github/workflows/test.yml
    with:
      full: true

  # spork-lang is pure Python; its single py3-none-any wheel supports every
  # interpreter in the 3.10-3.14t test matrix. Native wheels come from spork-pds.
  build:
    name: Build universal Python 3 distributions
    needs: full_tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up minimum supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*-py3-none-any.whl' | wc -l)" -eq 1

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: ./dist/*

  test_distribution:
    name: Test wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set PYTHON_GIL=0 for free-threaded Python
        if: endsWith(matrix.python-version, 't')
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Download universal distribution
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import spork_pds; from spork.runtime import Vector; assert Vector is spork_pds.Vector"
          python -m spork -c "(print (+ 1 2))"

  publish:
    name: Publish to PyPI
    needs: [build, test_distribution]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/spork-lang
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: [build, test_distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
