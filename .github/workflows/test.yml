name: Tests

on:
  # Regular branch pushes use the smaller core matrix below. Tag releases call
  # this workflow with `full: true` from build.yml.
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      full:
        description: Run the full release test matrix
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Run the full release test matrix
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Branch pushes cover the minimum, latest, and free-threaded interpreters
      # on Linux. Releases exercise every supported OS, architecture, and Python.
      matrix:
        os: ${{ inputs.full && fromJSON('["ubuntu-latest","ubuntu-24.04-arm","windows-latest","windows-11-arm","macos-15-intel","macos-15"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ${{ inputs.full && fromJSON('["3.10","3.11","3.12","3.13","3.14","3.14t"]') || fromJSON('["3.10","3.14","3.14t"]') }}
        exclude:
          # actions/setup-python does not provide CPython 3.10 for Windows ARM64.
          - os: windows-11-arm
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ (endsWith(matrix.os, '-arm') || matrix.os == 'macos-15') && 'arm64' || 'x64' }}
          allow-prereleases: true

      - name: Set PYTHON_GIL=0 for free-threaded builds (Unix)
        if: endsWith(matrix.python-version, 't') && runner.os != 'Windows'
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Set PYTHON_GIL=0 for free-threaded builds (Windows)
        if: endsWith(matrix.python-version, 't') && runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "PYTHON_GIL=0" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Print host info
        run: python tools/host_info.py

      - name: Verify released spork-pds integration
        run: python -c "import spork_pds; from spork.runtime import Vector; assert Vector is spork_pds.Vector"

      - name: Run Python tests
        run: python -m pytest

      - name: Run spork tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Running all .spork tests..."
          failed=0
          passed=0
          for test in tests/test_*.spork; do
            echo ""
            echo "=== Running $test ==="
            if python -m spork "$test"; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              echo "FAILED: $test"
            fi
          done
          echo ""
          echo "=== Test Summary ==="
          echo "Passed: $passed"
          echo "Failed: $failed"
          if [ $failed -gt 0 ]; then
            echo "Some tests failed!"
            exit 1
          else
            echo "All tests passed!"
          fi

      - name: Run spork tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          Write-Host "Running all .spork tests..."
          $failed = 0
          $passed = 0
          $tests = Get-ChildItem -Path "tests/test_*.spork"
          foreach ($test in $tests) {
            Write-Host ""
            Write-Host "=== Running $($test.Name) ==="
            python -m spork $test.FullName
            if ($LASTEXITCODE -eq 0) {
              $passed++
            } else {
              $failed++
              Write-Host "FAILED: $($test.Name)"
            }
          }
          Write-Host ""
          Write-Host "=== Test Summary ==="
          Write-Host "Passed: $passed"
          Write-Host "Failed: $failed"
          if ($failed -gt 0) {
            Write-Host "Some tests failed!"
            exit 1
          } else {
            Write-Host "All tests passed!"
          }

  docs:
    name: Documentation examples - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ inputs.full && fromJSON('["3.10","3.11","3.12","3.13","3.14","3.14t"]') || fromJSON('["3.14"]') }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set PYTHON_GIL=0 for free-threaded Python
        if: endsWith(matrix.python-version, 't')
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify documentation examples
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/verify_docs.py
