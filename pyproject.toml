[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spork-lang"
version = "0.5.3"
description = "A Lisp to Python transpiler with persistent data structures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Grant Wade", email = "grant@spork.sh"}
]
keywords = [
    "lisp",
    "clojure",
    "transpiler",
    "compiler",
    "persistent-data-structures",
    "functional-programming",
    "repl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Lisp",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "build>=1",
    "packaging>=24",
    "setuptools>=77",
    "spork-runtime>=0.1.1,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "twine",
    "pytest>=8",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/spork-it/spork-lang"
Documentation = "https://github.com/spork-it/spork-lang#readme"
Repository = "https://github.com/spork-it/spork-lang"
Issues = "https://github.com/spork-it/spork-lang/issues"
Changelog = "https://github.com/spork-it/spork-lang/blob/main/CHANGELOG.md"

[project.scripts]
spork = "spork.cli:main"

[tool.setuptools]
# Keep editable installs on a plain sys.path entry so separately distributed
# spork namespace portions remain discoverable alongside this regular package.
package-dir = {"" = "."}

# Runtime and standard-library packages are supplied by spork-runtime.
packages = [
    "spork",
    "spork.compiler",
    "spork.lsp",
    "spork.project",
    "spork.repl",
    "spork.testing",
]
